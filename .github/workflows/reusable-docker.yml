name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
        image_name:
            description: "Docker image name"
            required: true
            type: string

        tag:
          description: "Docker image tag"
          required: true
          type: string

        docker_username:
          description: "Docker Hub username"
          required: true
          type: string

    secrets:
        docker_username:
            description: "Docker Hub username"
            required: true

        docker_token:
            description: "Docker Hub access token"
            required: true

    outputs:
        image_url:
            description: "Full Docker image path"
            value: ${{jobs.docker.outputs.image_url}}

jobs:
    docker:
        runs-on: ubuntu-latest

        outputs:
            image_url: ${{steps.image.outputs.image_url}}

        steps:
            - name: Git checkout
              uses: actions/checkout@v7

            - name: login to docker hub
              uses: docker/login-action@v4
              with:
                 username: ${{ secrets.docker_username }}
                 password: ${{ secrets.docker_token }}

            - name: Build and push Docker image
              run: |
                IMAGE="${{ inputs.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"
                echo "Building Docker image: $IMAGE"
                docker build -t "$IMAGE" .
                docker push "$IMAGE"

            - name: Set image output
              id: image
              run: |
                IMAGE="${{ inputs.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"
                echo "image_url=$IMAGE" >> "$GITHUB_OUTPUT"
                echo "Image pushed Successfully: $IMAGE"
             
