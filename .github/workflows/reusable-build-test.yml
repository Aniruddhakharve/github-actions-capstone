name: Reusable Build and Test

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: "3.12"

      run-tests:
        description: "Whether to run tests"
        required: false
        type: boolean
        default: true

    outputs:
      test-result:
        description: "Result of the test execution"
        value: ${{ jobs.build-test.outputs.test_result }}

jobs:
  build-test:
    runs-on: ubuntu-latest

    outputs:
      test_result: ${{ steps.test.outputs.test_result }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          python --version
          pip install -r requirements.txt

      - name: Run tests
        id: test
        if: ${{ inputs.run-tests }}
        continue-on-error: true
        run: |
          pytest
          TEST_EXIT_CODE=$?

          if [ "$TEST_EXIT_CODE" -eq 0 ]; then
            echo "test_result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "test_result=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Run Tests skipped
        if: ${{ !inputs.run-tests }}
        run: |
          echo "Tests were skipped."